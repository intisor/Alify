name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Alify.Android/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Persistent Signing Keystore
        run: |
          if [ ! -f Alify.Android/release.keystore ]; then
            keytool -genkeypair -v -keystore Alify.Android/release.keystore -alias alify -keyalg RSA -keysize 2048 -validity 10000 -storepass alifypassword -keypass alifypassword -dname "CN=Alify, O=Alify, C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Alify.Android/release.keystore
            git commit -m "chore(android): add persistent release signing keystore" || true
            git push origin master || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Android Release APK
        run: |
          cd Alify.Android
          gradle assembleRelease --stacktrace

      - name: Locate and Rename APK
        run: |
          mkdir -p artifacts
          cp Alify.Android/app/build/outputs/apk/release/app-release.apk artifacts/Alify.apk
          echo "APK successfully built at artifacts/Alify.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alify-Android-APK
          path: artifacts/Alify.apk
          retention-days: 30
