name: .NET CI & Test Suites

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Deterministic Test Suites
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore Alify.sln

    - name: Build solution (0 warnings policy)
      run: dotnet build Alify.sln --no-restore --configuration Release

    - name: Execute automated unit and fault tests
      run: dotnet test Alify.sln --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test_results.trx"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: "**/test_results.trx"
        retention-days: 14
